<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK SIMLINK LITE UPDATER</title>

  <script type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js">
  </script>

  <style>
    /* ================= THEME SYSTEM ================= */
    :root {
      --bg: #0b0f14;
      --card: #141a22;
      --text: #e6e6e6;
      --muted: #9aa4ad;
      --accent: #00ff9d;
      --warn: #ff9f1c;
      --border: #222;
    }

    body.light {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111;
      --muted: #555;
      --border: #ddd;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 850px;
      margin: 40px auto;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    /* ================= BANNER ================= */
    .banner {
      width: 100%;
      height: 180px;
      border-radius: 12px;
      background: url("simlink.png") center/cover no-repeat;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    /* ================= BOX ================= */
    .box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      transition: 0.3s;
    }

    /* ================= BUTTONS ================= */
    button {
      padding: 10px 14px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      border-color: var(--accent);
    }

    /* ================= STATUS ================= */
    .ok { color: var(--accent); }
    .bad { color: var(--warn); }

    /* ================= FIRMWARE CARD ================= */
    .fw {
      margin-top: 18px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
    }
  </style>
</head>

<body>

<!-- BANNER -->
<div class="banner"></div>

<div class="box">

  <h1>AK FPV SIM LINK</h1>
  <p style="color:var(--muted)">ELRS Simulator Dongle</p>

  <p>Latest Firmware:
    <span id="latestVersion">---</span>
  </p>

  <p>Device Version:
    <span id="deviceVersion">Not Connected</span>
  </p>

  <p>Status:
    <span id="status">UNKNOWN</span>
  </p>

  <button onclick="readVersion()">Read Device Version</button>
  <button onclick="toggleTheme()">Dark / Light</button>

</div>

<!-- FIRMWARE LIST -->
<div id="firmwareList"></div>

<script>
let latestGlobal = "";

/* ================= THEME TOGGLE (FIXED) ================= */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* ================= LOAD FIRMWARE LIST ================= */
async function loadFirmwareList() {
  try {
    const res = await fetch("./manifest-lite.json");
    const data = await res.json();

    latestGlobal = data.latest;

    document.getElementById("latestVersion").innerText = data.latest;

    const container = document.getElementById("firmwareList");

    data.firmwares.forEach(fw => {
      const div = document.createElement("div");
      div.className = "fw";

      div.innerHTML = `
        <h3>${fw.version}</h3>
        <p style="color:var(--muted)">${fw.notes || ""}</p>

        <esp-web-install-button
          manifest="./Firmware/${fw.file}">
        </esp-web-install-button>

        <p style="font-size:12px;color:var(--muted)">
          Click install → Flash ESP32
        </p>
      `;

      container.appendChild(div);
    });

  } catch (e) {
    console.error("Manifest load failed", e);
  }
}

/* ================= READ DEVICE VERSION ================= */
async function readVersion() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    const writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode("VERSION?\n"));
    writer.releaseLock();

    const reader = port.readable.getReader();

    let buffer = "";
    const decoder = new TextDecoder();

    const timeout = setTimeout(async () => {
      await reader.cancel();
    }, 800);

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value || new Uint8Array());

      if (buffer.includes("VERSION:")) break;
    }

    clearTimeout(timeout);

    await reader.releaseLock();
    await port.close();

    console.log("RAW:", buffer);

    const match = buffer.match(/VERSION:([0-9.]+)/);

    const deviceEl = document.getElementById("deviceVersion");
    const statusEl = document.getElementById("status");

    if (match) {
      const v = match[1];

      deviceEl.innerText = v;
      compare(v, latestGlobal);
    } else {
      deviceEl.innerText = "Unknown";
      statusEl.innerText = "NO RESPONSE";
      statusEl.className = "bad";
    }

  } catch (err) {
    console.error(err);
    document.getElementById("deviceVersion").innerText = "Read Failed";
  }
}
/* ================= COMPARE ================= */
function compare(device, latest) {
  const status = document.getElementById("status");

  const d = toNum(device);
  const l = toNum(latest);

  if (d >= l) {
    status.innerText = "UP TO DATE";
    status.className = "ok";
  } else {
    status.innerText = "UPDATE AVAILABLE";
    status.className = "bad";
  }
}

/* ================= VERSION PARSER ================= */
function toNum(v) {
  return v.split(".").reduce((a,b)=>a*100+parseInt(b||0),0);
}

/* ================= CLEAN INSTALL FLOW FIX ================= */
/* This prevents ESP Web Tools from trapping user in extra UI screens */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("esp-web-install-button").forEach(btn => {
    btn.addEventListener("finished", () => {
      console.log("Install complete");

      setTimeout(() => {
        alert("Installation Complete ✔");
      }, 300);
    });
  });
});

/* INIT */
loadFirmwareList();
</script>

</body>
</html>

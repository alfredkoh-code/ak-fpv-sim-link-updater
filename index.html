<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AK FPV SIM LINK Updater</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      transition: 0.3s;
    }

    .dark {
      background: #111;
      color: #eee;
    }

    button {
      padding: 10px 15px;
      margin: 5px;
      cursor: pointer;
    }

    .badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 6px;
      background: #333;
      color: white;
    }
  </style>
</head>

<body>

<h2>AK FPV SIM LINK Updater</h2>

<p>Device Version: <span id="deviceVersion">---</span></p>
<p>Status: <span id="statusBadge" class="badge">UNKNOWN</span></p>

<button onclick="connectSerial()">Connect & Read</button>
<button onclick="toggleDarkMode()">Dark Mode</button>

<script>
let latestVersionGlobal = "1.0.0";

/* ---------------- DARK MODE ---------------- */
function toggleDarkMode() {
  document.body.classList.toggle("dark");
}

/* ---------------- SERIAL ---------------- */
async function connectSerial() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    readVersion(port);

  } catch (err) {
    console.error(err);
    alert("Serial connection failed");
  }
}

/* ---------------- READ VERSION ---------------- */
async function readVersion(port) {
  try {
    const reader = port.readable.getReader();

    const { value } = await reader.read();
    const response = new TextDecoder().decode(value || new Uint8Array());

    reader.releaseLock();
    await port.close();

    console.log("RESPONSE:", response);

    const match = /VERSION:([0-9.]+)/.exec(response);

    const deviceEl = document.getElementById("deviceVersion");

    if (match) {
      const deviceVersion = match[1];

      if (deviceEl) deviceEl.innerText = deviceVersion;

      compareVersion(deviceVersion, latestVersionGlobal);

    } else {
      if (deviceEl) deviceEl.innerText = "Unknown";
    }

  } catch (err) {
    console.error(err);

    const deviceEl = document.getElementById("deviceVersion");
    if (deviceEl) deviceEl.innerText = "Read Failed";
  }
}

/* ---------------- COMPARE VERSION ---------------- */
function compareVersion(deviceVersion, latestVersion) {
  const badge = document.getElementById("statusBadge");
  if (!badge) return;

  const device = versionToNumber(deviceVersion);
  const latest = versionToNumber(latestVersion);

  if (device >= latest) {
    badge.innerText = "UP TO DATE";
    badge.style.color = "lime";
  } else {
    badge.innerText = "UPDATE AVAILABLE";
    badge.style.color = "orange";
  }
}

/* ---------------- VERSION PARSER ---------------- */
function versionToNumber(v) {
  if (!v) return 0;
  return v.split(".").reduce((a, b) => a * 100 + parseInt(b || 0), 0);
}
</script>

</body>
</html>

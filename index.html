<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK FPV SIM LINK</title>

  <script type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      text-align: center;
    }

    .box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 30px;
    }
  </style>
</head>

<body>

<div class="box">

<h1>AK FPV SIM LINK</h1>

<p>ELRS Simulator Dongle</p>

<p>Latest Firmware: <span id="latestVersion"></span></p>

<p>Device Version: <span id="deviceVersion">Not Connected</span></p>

<button onclick="readVersion()">
    Read Device Version
</button>

</div>

<div id="firmwareList"></div>

<script>
async function loadFirmwareList() {
    const res = await fetch("./manifest.json");
    const data = await res.json();

    document.getElementById("latestVersion").innerText = data.latest;

    const container = document.getElementById("firmwareList");

    data.firmwares.forEach(fw => {
        const div = document.createElement("div");

        div.innerHTML = `
            <h3>Version ${fw.version}</h3>
            <p>${fw.notes}</p>
            <esp-web-install-button
                manifest="./Firmware/${fw.file}">
            </esp-web-install-button>
            <hr>
        `;

        container.appendChild(div);
    });
}

async function readVersion()
{
    try
    {
        const port = await navigator.serial.requestPort();

        await port.open({ baudRate: 115200 });

        const writer = port.writable.getWriter();

        await writer.write(
            new TextEncoder().encode("VERSION?\n")
        );

        writer.releaseLock();

        const reader = port.readable.getReader();

        const { value } = await reader.read();

        const response = new TextDecoder().decode(value);

        document.getElementById("deviceVersion").innerText =
            response.trim();

        reader.releaseLock();

        await port.close();
    }
    catch(err)
    {
        document.getElementById("deviceVersion").innerText =
            "Read Failed";

        console.error(err);
    }
}

loadFirmwareList();
</script>

</body>
</html>

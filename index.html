<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK FPV SIM LINK</title>

  <script type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js">
  </script>

  <style>
    /* ===== THEME SYSTEM (FIXED PROPERLY) ===== */
    :root {
      --bg: #0b0f14;
      --card: #141a22;
      --text: #e6e6e6;
      --muted: #9aa4ad;
      --accent: #00ff9d;
      --warn: #ff9f1c;
      --border: #222;
    }

    body.light {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111;
      --muted: #555;
      --border: #ddd;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
      background: var(--bg);
      color: var(--text);
      transition: 0.3s;
    }

    .box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 25px;
      background: var(--card);
      transition: 0.3s;
    }

    button {
      padding: 10px 14px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      border-color: var(--accent);
    }

    .ok { color: var(--accent); }
    .bad { color: var(--warn); }

    .fw {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    /* ===== BANNER IMAGE ===== */
    .banner {
      width: 100%;
      height: 180px;
      margin-bottom: 20px;
      border-radius: 12px;
      background: url("simlink.png") center/cover no-repeat;
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>

<!-- IMAGE BANNER -->
<div class="banner"></div>

<div class="box">

<h1>AK FPV SIM LINK</h1>
<p style="color:var(--muted)">ELRS Simulator Dongle</p>

<p>Latest Firmware:
  <span id="latestVersion">---</span>
</p>

<p>Device Version:
  <span id="deviceVersion">Not Connected</span>
</p>

<p>Status:
  <span id="status">UNKNOWN</span>
</p>

<button onclick="readVersion()">Read Device Version</button>
<button onclick="toggleTheme()">Toggle Dark/Light</button>

</div>

<div id="firmwareList"></div>

<script>
let latestGlobal = "";

/* ===== FIXED THEME TOGGLE ===== */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* LOAD FIRMWARE LIST */
async function loadFirmwareList() {
  try {
    const res = await fetch("./manifest.json");
    const data = await res.json();

    latestGlobal = data.latest;

    document.getElementById("latestVersion").innerText = data.latest;

    const container = document.getElementById("firmwareList");

    data.firmwares.forEach(fw => {
      const div = document.createElement("div");

      div.className = "fw";

      div.innerHTML = `
        <h3>${fw.version}</h3>
        <p style="color:var(--muted)">${fw.notes || ""}</p>

        <esp-web-install-button
          manifest="./Firmware/${fw.file}">
        </esp-web-install-button>
      `;

      container.appendChild(div);
    });

  } catch (e) {
    console.error("Manifest load failed", e);
  }
}

/* READ DEVICE VERSION */
async function readVersion() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    const writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode("VERSION?\n"));
    writer.releaseLock();

    const reader = port.readable.getReader();
    const { value } = await reader.read();

    const response = new TextDecoder().decode(value || new Uint8Array());

    reader.releaseLock();
    await port.close();

    const match = /([0-9.]+)/.exec(response);

    const deviceEl = document.getElementById("deviceVersion");
    const statusEl = document.getElementById("status");

    if (match) {
      const v = match[1];

      deviceEl.innerText = v;
      compare(v, latestGlobal);

    } else {
      deviceEl.innerText = "Unknown";
      statusEl.innerText = "NO RESPONSE";
      statusEl.className = "bad";
    }

  } catch (err) {
    console.error(err);
    document.getElementById("deviceVersion").innerText = "Read Failed";
  }
}

/* COMPARE */
function compare(device, latest) {
  const status = document.getElementById("status");

  const d = toNum(device);
  const l = toNum(latest);

  if (d >= l) {
    status.innerText = "UP TO DATE";
    status.className = "ok";
  } else {
    status.innerText = "UPDATE AVAILABLE";
    status.className = "bad";
  }
}

/* VERSION PARSER */
function toNum(v) {
  return v.split(".").reduce((a,b)=>a*100+parseInt(b||0),0);
}

loadFirmwareList();
</script>

</body>
</html>

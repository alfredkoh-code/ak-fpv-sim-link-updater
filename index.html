<script>
let latestVersionGlobal = "";
function versionToNumber(v) { return v.split('.') .map(Number) .reduce((acc,num)=>acc*1000+num,0); }
3
async function loadFirmwareList() { const res = await fetch("./manifest.json"); const data = await
res.json();
latestVersionGlobal = data.latest;
document.getElementById("latestVersion").innerText =
data.latest;
const latestFw =
data.firmwares.find(
fw => fw.version === data.latest
);
if(latestFw)
{
document.getElementById(
"latestFirmwareCard"
).innerHTML =
`
<div class="latestCard">
<h2>Latest Release v${latestFw.version}</h2>
<p>${latestFw.notes}</p>
<esp-web-install-button
manifest="./Firmware/${latestFw.file}">
</esp-web-install-button>
</div>
`;
}
const container =
document.getElementById("firmwareList");
container.innerHTML = "";
data.firmwares.forEach(fw =>
{
const div =
document.createElement("div");
div.className = "firmwareCard";
div.innerHTML =
`
<div class="versionTitle">
Version ${fw.version}
</div>
<div class="releaseNote">
${fw.notes}
</div>
4
<esp-web-install-button
manifest="./Firmware/${fw.file}">

`;
container.appendChild(div);
});
}
async function readVersion() { try { const port = await navigator.serial.requestPort();
await port.open({
baudRate:115200
});
await new Promise(resolve =>
setTimeout(resolve,1500)
);
const writer =
port.writable.getWriter();
await writer.write(
new TextEncoder().encode(
"VERSION?\n"
)
);
writer.releaseLock();
const reader = port.readable.getReader();

const { value } = await reader.read();
const response = new TextDecoder().decode(value);

reader.releaseLock();
await port.close();

const match = /VERSION:([0-9.]+)/.exec(response);

try {
  if (match) {
    const deviceVersion = match[1];

    document.getElementById("deviceVersion").innerText = deviceVersion;

    compareVersion(deviceVersion, latestVersionGlobal);
  } else {
    document.getElementById("deviceVersion").innerText = "Unknown";
  }
} catch (err) {
  console.error(err);
  document.getElementById("deviceVersion").innerText = "Read Failed";
}

function compareVersion(deviceVersion, latestVersion) {
  const badge = document.getElementById("statusBadge");

  if (
    versionToNumber(deviceVersion) >=
    versionToNumber(latestVersion)
  ) {
    badge.innerText = "UP TO DATE";
    badge.style.color = "lime";
  } else {
    badge.innerText = "UPDATE AVAILABLE";
    badge.style.color = "orange";
  }
}

function toggleTheme() { document.body.classList.toggle( "light" );
const dark =
document.body.classList.contains(
"light"
);
localStorage.setItem(
"theme",
dark ? "light":"dark"
);
updateThemeButton();
}
function updateThemeButton() { const btn = document.getElementById( "themeBtn" );
if(
document.body.classList.contains(
"light"
)
)
{
btn.innerText =
"
☀️ Light Mode";
}
else
{
btn.innerText =
"
🌙 Dark Mode";
}
}
if( localStorage.getItem("theme") === "light" ) { document.body.classList.add( "light" ); }

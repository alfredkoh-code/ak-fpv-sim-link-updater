<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK FPV SIM LINK</title>

  <style>
    :root {
      --bg: #0b0f14;
      --card: #141a22;
      --text: #e6e6e6;
      --muted: #9aa4ad;
      --accent: #00ff9d;
      --warn: #ff9f1c;
      --border: #222;
    }

    body.light {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #111;
      --border: #ddd;
    }

    body {
      font-family: Arial;
      background: var(--bg);
      color: var(--text);
      max-width: 850px;
      margin: 40px auto;
      text-align: center;
    }

    .banner {
      height: 180px;
      background: url("simlink.png") center/cover no-repeat;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .box {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px 14px;
      margin: 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
    }

    .fw {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
    }

    .ok { color: var(--accent); }
    .bad { color: var(--warn); }
  </style>
</head>

<body>

<div class="banner"></div>

<div class="box">

  <h1>AK FPV SIM LINK</h1>

  <p>Latest: <span id="latestVersion">---</span></p>
  <p>Device: <span id="deviceVersion">---</span></p>
  <p>Status: <span id="status">UNKNOWN</span></p>

  <button onclick="readVersion()">Read Device</button>
  <button onclick="toggleTheme()">Theme</button>

</div>

<div id="firmwareList"></div>

<script>
let latestGlobal = "";

/* THEME */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* LOAD FIRMWARE */
async function loadFirmwareList() {
  const res = await fetch("./manifest.json");
  const data = await res.json();

  latestGlobal = data.latest;
  document.getElementById("latestVersion").innerText = data.latest;

  const container = document.getElementById("firmwareList");

  data.firmwares.forEach(fw => {
    const div = document.createElement("div");
    div.className = "fw";

    div.innerHTML = `
      <h3>${fw.version}</h3>
      <p>${fw.notes || ""}</p>

      <button onclick="installFirmware('${fw.file}', '${fw.version}')">
        INSTALL
      </button>
    `;

    container.appendChild(div);
  });
}

/* 🚀 CUSTOM INSTALL (NO ESP DASHBOARD) */
async function installFirmware(file, version) {
  try {
    const response = await fetch("./Firmware/" + file);
    const firmware = await response.arrayBuffer();

    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    const writer = port.writable.getWriter();

    // simple raw flash trigger (depends on your ESP firmware bootloader)
    await writer.write(firmware);

    writer.releaseLock();
    await port.close();

    alert("Firmware " + version + " installed ✔");

  } catch (err) {
    console.error(err);
    alert("Install failed");
  }
}

/* READ VERSION */
async function readVersion() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    const writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode("VERSION?\n"));
    writer.releaseLock();

    const reader = port.readable.getReader();
    const { value } = await reader.read();

    const text = new TextDecoder().decode(value || new Uint8Array());

    reader.releaseLock();
    await port.close();

    const match = /([0-9.]+)/.exec(text);

    if (match) {
      document.getElementById("deviceVersion").innerText = match[1];
      compare(match[1], latestGlobal);
    }

  } catch (e) {
    console.error(e);
  }
}

/* COMPARE */
function compare(d, l) {
  const status = document.getElementById("status");

  const dv = d.split(".").reduce((a,b)=>a*100+parseInt(b),0);
  const lv = l.split(".").reduce((a,b)=>a*100+parseInt(b),0);

  if (dv >= lv) {
    status.innerText = "UP TO DATE";
    status.className = "ok";
  } else {
    status.innerText = "UPDATE AVAILABLE";
    status.className = "bad";
  }
}

loadFirmwareList();
</script>

</body>
</html>

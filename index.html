<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AK FPV SIM LINK Updater</title>

<style>
:root {
  --bg: #0b0f14;
  --card: #141a22;
  --text: #e6e6e6;
  --muted: #8b98a5;
  --green: #00ff9d;
  --orange: #ff9f1c;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* DARK MODE (REAL EFFECTS) */
body.dark {
  --bg: #f5f6f8;
  --card: #ffffff;
  --text: #111;
  --muted: #555;
}

/* HEADER */
.header {
  text-align: center;
  padding: 25px;
}

.header h1 {
  font-size: 36px;
  margin: 0;
}

.header span {
  color: var(--green);
}

/* BANNER */
.banner {
  height: 180px;
  background: url("simlink.png") center/cover no-repeat;
}

/* CONTAINER */
.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

/* CARD */
.card {
  background: var(--card);
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 15px;
  transition: 0.3s;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}

/* BUTTONS */
button {
  padding: 10px 14px;
  border-radius: 10px;
  border: 1px solid #2c3b4d;
  background: #1f2a36;
  color: var(--text);
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  border-color: var(--green);
  transform: translateY(-1px);
}

/* BADGES */
.badge {
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: bold;
  display: inline-block;
}

.up { background: rgba(0,255,157,0.15); color: var(--green); }
.down { background: rgba(255,159,28,0.15); color: var(--orange); }
</style>
</head>

<body>

<div class="banner"></div>

<div class="header">
  <h1>AK <span>FPV SIM LINK</span></h1>
</div>

<div class="container">

  <div class="card">
    <h3>Device Status</h3>

    <p>Version: <span id="deviceVersion">---</span></p>
    <p>Status: <span id="statusBadge" class="badge">UNKNOWN</span></p>

    <button onclick="connectSerial()">Connect Device</button>
    <button onclick="toggleDark()">Toggle Dark</button>
  </div>

  <div class="grid">

    <div class="card">
      <h3>Firmware 1.5.0</h3>
      <button onclick="selectFirmware('1.5.0')">Select</button>
    </div>

    <div class="card">
      <h3>Firmware 1.4.1</h3>
      <button onclick="selectFirmware('1.4.1')">Select</button>
    </div>

  </div>

</div>

<script>
let latestFirmware = "1.5.0";
let port = null;
let reader = null;

/* DARK MODE (FIXED) */
function toggleDark() {
  document.body.classList.toggle("dark");
}

/* FIRMWARE SELECT (NOW WORKS) */
function selectFirmware(v) {
  latestFirmware = v;
  alert("Selected: " + v);

  const badge = document.getElementById("statusBadge");
  badge.innerText = "READY (" + v + ")";
}

/* CONNECT SERIAL (FIXED STREAM LOOP) */
async function connectSerial() {
  try {
    port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    listenSerial();

  } catch (err) {
    console.error(err);
    alert("Connection failed");
  }
}

/* CONTINUOUS READ (IMPORTANT FIX) */
async function listenSerial() {
  const decoder = new TextDecoder();

  while (port && port.readable) {
    try {
      reader = port.readable.getReader();
      const { value, done } = await reader.read();

      if (done) break;

      const text = decoder.decode(value);

      console.log("RX:", text);

      const match = /VERSION:([0-9.]+)/.exec(text);

      if (match) {
        const v = match[1];

        document.getElementById("deviceVersion").innerText = v;

        compare(v, latestFirmware);
      }

      reader.releaseLock();

    } catch (e) {
      console.error("Serial loop error:", e);
      break;
    }
  }
}

/* COMPARE */
function compare(device, latest) {
  const badge = document.getElementById("statusBadge");

  const d = toNum(device);
  const l = toNum(latest);

  if (d >= l) {
    badge.innerText = "UP TO DATE";
    badge.className = "badge up";
  } else {
    badge.innerText = "UPDATE AVAILABLE";
    badge.className = "badge down";
  }
}

/* VERSION PARSER */
function toNum(v) {
  return v.split(".").reduce((a,b)=>a*100+parseInt(b||0),0);
}
</script>

</body>
</html>

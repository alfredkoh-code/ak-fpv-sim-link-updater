<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AK FPV SIM LINK Updater</title>

<style>
:root {
  --bg: #0b0f14;
  --card: #141a22;
  --text: #e6e6e6;
  --muted: #8b98a5;
  --green: #00ff9d;
  --orange: #ff9f1c;
  --btn: #1f2a36;
}

body {
  margin: 0;
  font-family: Arial;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* DARK MODE SYSTEM (REAL FIX) */
body.light {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #111;
  --muted: #444;
  --btn: #e9eef3;
}

.banner {
  height: 180px;
  background: url("simlink.png") center/cover no-repeat;
}

.header {
  text-align: center;
  padding: 20px;
}

.header h1 {
  margin: 0;
  font-size: 36px;
}

.header span {
  color: var(--green);
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: var(--card);
  padding: 15px;
  border-radius: 14px;
  margin-bottom: 15px;
  transition: 0.3s;
}

button {
  background: var(--btn);
  border: 1px solid #2c3b4d;
  color: var(--text);
  padding: 10px 14px;
  border-radius: 10px;
  cursor: pointer;
  margin-right: 6px;
}

button:hover {
  border-color: var(--green);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}

.badge {
  padding: 5px 12px;
  border-radius: 20px;
  font-weight: bold;
}

.up { color: var(--green); background: rgba(0,255,157,0.15); }
.down { color: var(--orange); background: rgba(255,159,28,0.15); }
</style>
</head>

<body>

<div class="banner"></div>

<div class="header">
  <h1>AK <span>FPV SIM LINK</span></h1>
</div>

<div class="container">

  <div class="card">
    <h3>Device</h3>

    <p>Version: <span id="deviceVersion">---</span></p>
    <p>Status: <span id="statusBadge" class="badge">UNKNOWN</span></p>

    <button onclick="connectSerial()">Connect</button>
    <button onclick="toggleTheme()">Dark/Light</button>
  </div>

  <div class="grid">

    <div class="card">
      <h3>Firmware 1.5.0</h3>
      <button onclick="selectFirmware('1.5.0')">Select</button>
    </div>

    <div class="card">
      <h3>Firmware 1.4.1</h3>
      <button onclick="selectFirmware('1.4.1')">Select</button>
    </div>

  </div>

</div>

<script>
let state = {
  latestFirmware: "1.5.0",
  deviceVersion: null,
  port: null,
  reader: null
};

/* THEME (FIXED PROPERLY) */
function toggleTheme() {
  document.body.classList.toggle("light");
}

/* FIRMWARE SELECTION (REAL EFFECT) */
function selectFirmware(v) {
  state.latestFirmware = v;

  updateStatus();

  alert("Firmware selected: " + v);
}

/* SERIAL CONNECT */
async function connectSerial() {
  try {
    state.port = await navigator.serial.requestPort();
    await state.port.open({ baudRate: 115200 });

    readLoop();

  } catch (err) {
    console.error(err);
    alert("Serial failed");
  }
}

/* CONTINUOUS SERIAL STREAM */
async function readLoop() {
  const decoder = new TextDecoder();

  while (state.port && state.port.readable) {
    try {
      const reader = state.port.readable.getReader();
      const { value, done } = await reader.read();

      if (done) break;

      const text = decoder.decode(value || new Uint8Array());

      console.log("RX:", text);

      const match = /VERSION:([0-9.]+)/.exec(text);

      if (match) {
        state.deviceVersion = match[1];

        document.getElementById("deviceVersion").innerText = state.deviceVersion;

        updateStatus();
      }

      reader.releaseLock();

    } catch (e) {
      console.error("Loop error:", e);
      break;
    }
  }
}

/* STATUS ENGINE (REAL LOGIC) */
function updateStatus() {
  const badge = document.getElementById("statusBadge");
  if (!badge) return;

  if (!state.deviceVersion) {
    badge.innerText = "NO DATA";
    return;
  }

  const d = toNum(state.deviceVersion);
  const l = toNum(state.latestFirmware);

  if (d >= l) {
    badge.innerText = "UP TO DATE";
    badge.className = "badge up";
  } else {
    badge.innerText = "UPDATE AVAILABLE";
    badge.className = "badge down";
  }
}

/* VERSION PARSER */
function toNum(v) {
  return v.split(".").reduce((a,b)=>a*100+parseInt(b||0),0);
}
</script>

</body>
</html>

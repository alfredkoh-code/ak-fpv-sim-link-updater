<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AK FPV SIM LINK</title>

  <script type="module"
    src="https://unpkg.com/esp-web-tools@9/dist/web/install-button.js">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      text-align: center;
      background: #0b0f14;
      color: #e6e6e6;
    }

    .box {
      border: 1px solid #222;
      border-radius: 12px;
      padding: 25px;
      background: #141a22;
    }

    button {
      padding: 10px 14px;
      margin: 8px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1f2a36;
      color: white;
      cursor: pointer;
    }

    button:hover {
      border-color: #00ff9d;
    }

    .ok { color: #00ff9d; }
    .bad { color: #ff9f1c; }

    .fw {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      background: #111722;
    }
  </style>
</head>

<body>

<div class="box">

<h1>AK FPV SIM LINK</h1>
<p>ELRS Simulator Dongle</p>

<p>Latest Firmware:
  <span id="latestVersion">---</span>
</p>

<p>Device Version:
  <span id="deviceVersion">Not Connected</span>
</p>

<p>Status:
  <span id="status">UNKNOWN</span>
</p>

<button onclick="readVersion()">Read Device Version</button>
<button onclick="toggleTheme()">Toggle Theme</button>

</div>

<div id="firmwareList"></div>

<script>
let latestGlobal = "";

function toggleTheme() {
  document.body.classList.toggle("light");

  if (document.body.classList.contains("light")) {
    document.body.style.background = "#f4f6f8";
    document.body.style.color = "#111";
  } else {
    document.body.style.background = "#0b0f14";
    document.body.style.color = "#e6e6e6";
  }
}

/* LOAD FIRMWARE LIST */
async function loadFirmwareList() {
  try {
    const res = await fetch("./manifest.json");
    const data = await res.json();

    latestGlobal = data.latest;

    document.getElementById("latestVersion").innerText = data.latest;

    const container = document.getElementById("firmwareList");

    data.firmwares.forEach(fw => {
      const div = document.createElement("div");

      div.className = "fw";

      div.innerHTML = `
        <h3>${fw.version}</h3>
        <p>${fw.notes || ""}</p>

        <esp-web-install-button
          manifest="./Firmware/${fw.file}">
        </esp-web-install-button>

        <p style="font-size:12px;opacity:0.6">
          Click install button to flash ESP32
        </p>
      `;

      container.appendChild(div);
    });

  } catch (e) {
    console.error("Manifest load failed", e);
  }
}

/* READ DEVICE VERSION (FIXED + STABLE) */
async function readVersion() {
  try {
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 115200 });

    const writer = port.writable.getWriter();
    await writer.write(new TextEncoder().encode("VERSION?\n"));
    writer.releaseLock();

    const reader = port.readable.getReader();
    const { value } = await reader.read();

    const response = new TextDecoder().decode(value || new Uint8Array());

    reader.releaseLock();
    await port.close();

    const match = /([0-9.]+)/.exec(response);

    const deviceEl = document.getElementById("deviceVersion");
    const statusEl = document.getElementById("status");

    if (match) {
      const v = match[1];

      deviceEl.innerText = v;

      compare(v, latestGlobal);

    } else {
      deviceEl.innerText = "Unknown";
      statusEl.innerText = "NO RESPONSE";
      statusEl.className = "bad";
    }

  } catch (err) {
    console.error(err);

    document.getElementById("deviceVersion").innerText = "Read Failed";
  }
}

/* COMPARE */
function compare(device, latest) {
  const status = document.getElementById("status");

  const d = toNum(device);
  const l = toNum(latest);

  if (d >= l) {
    status.innerText = "UP TO DATE";
    status.className = "ok";
  } else {
    status.innerText = "UPDATE AVAILABLE";
    status.className = "bad";
  }
}

/* VERSION PARSER */
function toNum(v) {
  return v.split(".").reduce((a,b)=>a*100+parseInt(b||0),0);
}

loadFirmwareList();
</script>

</body>
</html>
